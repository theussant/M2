<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi amor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Essencial para o celular não criar rolagem */
            touch-action: none; /* Melhora a resposta do toque */
        }

        .container {
            text-align: center;
            width: 90%; /* Ocupa 90% da largura da tela */
            max-width: 400px; /* Mas não passa de 400px */
            background-color: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10; /* Garante que o container fique acima */
        }

        .couple-image {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #d63384;
            font-size: 1.8em; /* Tamanho bom para celular */
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            min-height: 60px; /* Reserva espaço para os botões */
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent; /* Remove o flash azul no toque */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-si {
            background-color: #28a745;
            color: white;
            z-index: 20; /* O Sim sempre fica clicável */
        }

        .btn-no {
            background-color: #dc3545;
            color: white;
            position: relative; /* Começa relativo, vira fixed depois */
            transition: top 0.2s, left 0.2s; /* Movimento suave */
        }

        #response-message {
            display: none;
            color: #d63384;
        }
        
        #response-message img {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div id="question-box">
            <img src="Gemini_Generated_Image_9giyfm9giyfm9giy.png" alt="Pareja" class="couple-image">
            
            <h1>¿Vuelves a ser mi novia?</h1>
            
            <div class="buttons-container">
                <button class="btn btn-si" id="siBtn">¡SÍ!</button>
                <button class="btn btn-no" id="noBtn">NO</button>
            </div>
        </div>

        <div id="response-message">
            <h1>Si presionaste SÍ, mándame una foto de tu sonrisa por WhatsApp ¡Sabía que dirías que SÍ! <br> Te amo ❤️</h1>
             <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Beso">
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const siBtn = document.getElementById('siBtn');
        const questionBox = document.getElementById('question-box');
        const responseMessage = document.getElementById('response-message');

        // Lógica para mover o botão (funciona para mouse E toque)
        function moveButton(e) {
            // Evita o comportamento padrão (como zoom ou seleção)
            if(e) e.preventDefault();

            // Pega o tamanho da janela e do botão
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Define posição fixed para ele se soltar do container
            noBtn.style.position = 'fixed';

            // Calcula nova posição aleatória
            // Math.random() * (LarguraTotal - LarguraBotão - Margem)
            const newLeft = Math.random() * (windowWidth - btnWidth - 20);
            const newTop = Math.random() * (windowHeight - btnHeight - 20);

            // Aplica as novas coordenadas
            noBtn.style.left = newLeft + 'px';
            noBtn.style.top = newTop + 'px';
        }

        // Eventos para Desktop (Mouse)
        noBtn.addEventListener('mouseover', moveButton);
        
        // Eventos para Celular (Toque)
        noBtn.addEventListener('touchstart', moveButton);
        noBtn.addEventListener('click', moveButton); // Fallback caso o toque passe

        // Lógica do botão SIM
        siBtn.addEventListener('click', function() {
            questionBox.style.display = 'none';
            responseMessage.style.display = 'block';
        });
    </script>

</body>
</html>
