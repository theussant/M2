<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi amor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
            touch-action: none; 
        }

        .container {
            text-align: center;
            width: 90%; 
            max-width: 400px;
            background-color: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10; 
        }

        .couple-image {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #d63384;
            font-size: 1.8em; 
            margin-bottom: 20px;
            line-height: 1.3;
        }

        p.final-text {
            color: #555;
            font-size: 1.1em;
            margin-top: 15px;
            font-weight: 500;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            min-height: 60px; 
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            display: inline-block;
        }

        .btn-si {
            background-color: #28a745;
            color: white;
            z-index: 20; 
        }

        .btn-no {
            background-color: #dc3545;
            color: white;
            position: relative; 
            transition: top 0.2s, left 0.2s; 
        }

        /* Estilo do botão do WhatsApp */
        .btn-whatsapp {
            background-color: #25D366; 
            color: white;
            margin-top: 15px;
            font-size: 1em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        #response-message {
            display: none;
            color: #d63384;
        }
        
        #response-message img {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .music-hint {
            font-size: 0.8em;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <audio id="bgm" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="main-container">
        <div id="question-box">
            <img src="Gemini_Generated_Image_9giyfm9giyfm9giy.png" alt="Pareja" class="couple-image">
            
            <h1>¿Vuelves a ser mi novia?</h1>
            
            <div class="buttons-container">
                <button class="btn btn-si" id="siBtn">¡SÍ!</button>
                <button class="btn btn-no" id="noBtn">NO</button>
            </div>
            <div class="music-hint">🎵 Toca la pantalla para música</div>
        </div>

        <div id="response-message">
            <h1>¡Sabía que dirías que SÍ! <br> Te amo ❤️</h1>
            
            <p class="final-text">Si presionaste SÍ, mándame una foto de tu sonrisa por WhatsApp.</p>

            <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Beso">

        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const siBtn = document.getElementById('siBtn');
        const questionBox = document.getElementById('question-box');
        const responseMessage = document.getElementById('response-message');
        const audio = document.getElementById('bgm');

        // --- LÓGICA DO ÁUDIO ---
        function playAudio() {
            audio.play().catch(error => {
                console.log("Aguardando interação para tocar");
            });
            // Remove o listener para não reiniciar o áudio toda vez que tocar
            document.body.removeEventListener('click', playAudio);
            document.body.removeEventListener('touchstart', playAudio);
        }

        // Tenta tocar no primeiro toque ou clique na tela
        document.body.addEventListener('click', playAudio);
        document.body.addEventListener('touchstart', playAudio);

        // --- LÓGICA DO BOTÃO FUGITIVO ---
        function moveButton(e) {
            if(e) e.preventDefault();
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            noBtn.style.position = 'fixed';

            const newLeft = Math.random() * (windowWidth - btnWidth - 20);
            const newTop = Math.random() * (windowHeight - btnHeight - 20);

            noBtn.style.left = newLeft + 'px';
            noBtn.style.top = newTop + 'px';
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton);
        noBtn.addEventListener('click', moveButton);

        // --- LÓGICA DO SIM ---
        siBtn.addEventListener('click', function() {
            questionBox.style.display = 'none';
            responseMessage.style.display = 'block';
            playAudio(); // Garante o play caso ainda não tenha tocado
        });
    </script>

</body>
</html>
